spring.application.name=bookapi
# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# DATABASE CONNECTION (MySQL)
# ===============================
# The '?createDatabaseIfNotExist=true' automatically creates 'bookdb' for you!
spring.datasource.url=jdbc:mysql://localhost:3306/bookdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=vijay27
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
# 'update' automatically creates or updates your database tables based on your Book entity
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL queries in your IntelliJ console (great for debugging)
spring.jpa.show-sql=true

# Tells Hibernate to optimize its queries for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
